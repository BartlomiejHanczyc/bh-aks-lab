apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: "api"
  namespace: "argocd"

spec:
  project: default
  source:
    repoURL: https://github.com/bartlomiej-hanczyc/bh-aks-lab.git
    targetRevision: main
    path: helm/api

    helm:
      releaseName: labapi
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: aks-lab

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true